# PyArabic configuration (fast, offline Arabic processing)
pyarabic_config:
  # Enable different PyArabic features
  normalize_hamza: true          # Normalize hamza forms
  normalize_alef: true           # Normalize alef forms  
  normalize_yeh: true            # Normalize yeh forms
  remove_diacritics: true        # Remove diacritical marks
  remove_tatweel: true           # Remove tatweel (kashida)
  normalize_teh: true            # Normalize teh marbuta
  
  # Stemming approach
  stemming_method: "light"       # Options: "light", "root", "prefix_suffix", "custom"
  use_root_extraction: false     # Try to extract Arabic roots
  
  # Light stemming parameters
  remove_common_prefixes: true   # Remove common prefixes (ال، و، ف، etc)
  remove_common_suffixes: true   # Remove common suffixes (ها، هم، etc)
  
  # Custom parameters
  aggressive_stemming: false     # More aggressive stemming if true

# Stemming parameters
stemming_params:
  min_word_length: 3        # Don't stem words shorter than this
  min_reduction_ratio: 0.6  # Don't reduce by more than 40%
  min_stem_length: 2        # Stem must be at least this long